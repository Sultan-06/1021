<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Digital Birthday Vault 💌</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="memory-wall.css" />
</head>
<body class="min-h-screen p-4 paper-texture">
  <a href="trivia.html" class="fixed left-3 top-3 z-40 rounded-full bg-[#FFFDF7] px-4 py-2 text-sm font-bold text-[#3A2A29] sketch-border-sm transition hover:-translate-y-0.5">
    ← Trivia quest
  </a>

  <main class="relative mx-auto my-12 w-full max-w-4xl rounded-3xl bg-[#FFFDF7] p-6 sketch-border shadow-2xl sm:p-10">
    <div class="washi-tape -top-3 left-1/2 -translate-x-1/2 rotate-2"></div>
    <header class="mb-8 text-center">
      <div class="mb-3 text-5xl" aria-hidden="true">💌</div>
      <p class="mb-2 text-xs font-bold uppercase tracking-[0.2em] text-[#9A7440]">A surprise just for you</p>
      <h1 class="text-3xl font-bold text-[#3A2A29] sm:text-4xl">The Digital Vault</h1>
      <p class="mt-3 text-sm font-semibold text-[#3A2A29]/80">Choose a letter to open whenever you need it. 💖</p>
    </header>

    <section class="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-2" id="vault-letters" aria-label="Birthday letters"></section>

    <div class="text-center">
      <a href="cake.html" class="mb-3 inline-flex items-center justify-center gap-2 rounded-xl bg-[#F9D5D3] px-6 py-3 font-bold text-[#3A2A29] sketch-border-sm transition hover:-translate-y-1">
        Cut your birthday cake 🎂
      </a>
      <br />
      <a href="birthday.html" class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#DFB45A] px-6 py-3 font-bold text-white sketch-border-sm transition hover:-translate-y-1 hover:bg-[#d3a445]">
        Back to the birthday wish
      </a>
    </div>
  </main>

  <div id="vault-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#3A2A29]/60 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="vault-modal-title">
    <section class="relative w-full max-w-lg rounded-3xl bg-[#FFFDF7] p-6 sketch-border shadow-2xl sm:p-8">
      <div class="washi-tape -top-3 left-10 -rotate-6"></div>
      <button id="vault-modal-close" type="button" class="absolute right-4 top-4 flex h-8 w-8 items-center justify-center rounded-full border-2 border-[#3A2A29] bg-[#F9D5D3] font-bold text-[#3A2A29]" aria-label="Close letter">✕</button>
      <div class="mb-4 text-center">
        <span id="vault-modal-icon" class="mb-1 inline-block text-4xl" aria-hidden="true">💌</span>
        <h2 id="vault-modal-title" class="text-2xl font-bold text-[#3A2A29]"></h2>
      </div>
      <p id="vault-modal-note" class="my-3 max-h-[60vh] overflow-y-auto whitespace-pre-line rounded-2xl border-2 border-dashed border-[#3A2A29]/40 bg-[#FFF9EB] p-5 font-hand text-2xl leading-relaxed text-[#3A2A29]"></p>
      <div class="mt-5 text-center">
        <button id="vault-modal-done" type="button" class="rounded-xl bg-[#DFB45A] px-6 py-2 font-display font-semibold text-white sketch-border-sm transition hover:scale-105">Keep in my heart 💖</button>
      </div>
    </section>
  </div>

  <script src="vault.js"></script>
</body>
</html>
