<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Memory Wall 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="memory-wall.css" />
</head>
<body class="min-h-screen paper-texture">
  <a href="birthday.html" class="fixed left-3 top-3 z-40 rounded-full bg-[#FFFDF7] px-4 py-2 text-sm font-bold text-[#3A2A29] sketch-border-sm transition hover:-translate-y-0.5">
    ← Birthday page
  </a>

  <main class="mx-auto w-full max-w-7xl px-4 py-10 sm:px-8">
    <header class="mb-8 text-center">
      <p class="mb-2 text-xs font-bold uppercase tracking-[0.2em] text-[#9A7440]">Little moments, big love</p>
      <h1 class="text-4xl font-bold text-[#3A2A29] sm:text-5xl">Our Memory Wall 💖</h1>
      <p class="mt-3 text-sm font-semibold text-[#3A2A29]/75">Tap a memory to turn it over and read the note. ✨</p>
    </header>

    <section id="polaroid-grid" class="mx-auto grid max-w-6xl grid-cols-2 gap-5 sm:gap-6 md:grid-cols-3 lg:grid-cols-4" aria-label="Twelve illustrated memories"></section>

    <footer class="mt-12 text-center">
      <a href="trivia.html" class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#DFB45A] px-7 py-3 font-bold text-white sketch-border-sm transition hover:-translate-y-1 hover:bg-[#d3a445]">
        Next surprise <span aria-hidden="true">➡️</span>
      </a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
